<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng Đăng Nhập - Dịch Vụ Sky</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

  <!-- THẺ ĐĂNG NHẬP DẠNG LIQUID GLASS -->
  <div class="card">
    <div style="font-size: 32px; margin-bottom: 8px;">☁️</div>
    <h2>Cổng Kết Nối Sky</h2>
    
    <label for="roleSelect">Bạn muốn đăng nhập vai trò nào?</label>
    <select id="roleSelect" onchange="hienThiTheoVaiTro()">
      <option value="khach">Khách Hàng</option>
      <option value="staff">Nhân Sự (Staff)</option>
      <option value="admin">Chủ Page (Admin)</option>
    </select>
    <br><br>

    <!-- 1. KHÁCH HÀNG (VÀO SẢNH TRỰC TIẾP) -->
    <div id="khuVucKhach">
      <button type="button" onclick="window.location.href='lobby.html'" style="width: 100%;">
        Vào Sảnh Tham Quan ✨
      </button>
    </div>

    <!-- 2. ADMIN NHẬP PASS (TRA CỨU CLOUD & CẤP SESSION) -->
    <div id="khuVucAdmin" style="display: none;">
      <label for="passAdmin">Mật mã Quản Trị:</label>
      <input type="password" id="passAdmin" placeholder="Nhập mật khẩu Admin..." onkeypress="if(event.key==='Enter') dangNhapAdmin()">
      <button type="button" id="btnAdminLogin" onclick="dangNhapAdmin()" style="width: 100%;">
        Vào Trang Quản Trị 👑
      </button>
    </div>

    <!-- 3. STAFF ĐĂNG NHẬP THEO TÀI KHOẢN CLOUD -->
    <div id="khuVucStaff" style="display: none;">
      <label for="selectStaffCloud">Chọn nhân sự của bạn:</label>
      <select id="selectStaffCloud">
        <option value="none">-- Đang tải danh sách Staff --</option>
      </select>
      
      <label for="passStaff">Mật khẩu riêng của bạn:</label>
      <input type="password" id="passStaff" placeholder="Nhập pass riêng..." onkeypress="if(event.key==='Enter') dangNhapStaff()">
      
      <button type="button" onclick="dangNhapStaff()" style="width: 100%;">
        Vào Ca Làm Việc 🚀
      </button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCEuMuKn4ZrzQNQCYnxt9XeNpPUsfQk54c",
      authDomain: "ordersky.firebaseapp.com",
      databaseURL: "https://ordersky-default-rtdb.firebaseio.com",
      projectId: "ordersky",
      storageBucket: "ordersky.firebasestorage.app",
      messagingSenderId: "332284986658",
      appId: "1:332284986658:web:02c42c4181900fc2e0917b",
      measurementId: "G-35XQCYMK8V"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    var danhSachStaffData = {};

    // 1. Tải danh sách Staff theo thời gian thực từ Firebase
    db.ref('danhSachStaff').on('value', function(snapshot) {
      danhSachStaffData = snapshot.val() || {};
      var select = document.getElementById("selectStaffCloud");
      select.innerHTML = "";

      var keys = Object.keys(danhSachStaffData);
      if (keys.length === 0) {
        select.innerHTML = `<option value="none">Chưa có Staff nào (Liên hệ Admin)</option>`;
      } else {
        keys.forEach(function(k) {
          var st = danhSachStaffData[k];
          select.innerHTML += `<option value="${k}">${st.icon || "🌸"} ${st.ten}</option>`;
        });
      }
    });

    // 2. Chuyển đổi giao diện theo vai trò
    function hienThiTheoVaiTro() {
      var vaiTro = document.getElementById("roleSelect").value;
      document.getElementById("khuVucKhach").style.display = vaiTro === "khach" ? "block" : "none";
      document.getElementById("khuVucAdmin").style.display = vaiTro === "admin" ? "block" : "none";
      document.getElementById("khuVucStaff").style.display = vaiTro === "staff" ? "block" : "none";
    }

    // 3. Đăng nhập Admin bảo mật: tra cứu pass từ Firebase và cấp sessionStorage
    function dangNhapAdmin() {
      var passInput = document.getElementById("passAdmin").value.trim();
      var btn = document.getElementById("btnAdminLogin");

      if (!passInput) {
        alert("Vui lòng nhập mật khẩu Quản Trị!");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Đang kiểm tra... ⏳";

      db.ref('caiDatBaoMat/passAdmin').once('value').then(function(snap) {
        var realPass = snap.val() || "boss123"; // Giá trị mặc định nếu chưa tạo node trên Firebase

        if (passInput === realPass) {
          // Cấp vé thông hành bảo mật cho Admin
          sessionStorage.setItem("sky_admin_logged", "true");
          sessionStorage.setItem("sky_admin_time", Date.now());
          window.location.href = "admin.html";
        } else {
          alert("Mật mã Admin không chính xác!");
          btn.disabled = false;
          btn.innerText = "Vào Trang Quản Trị 👑";
        }
      }).catch(function(err) {
        alert("Lỗi kiểm tra bảo mật: " + err.message);
        btn.disabled = false;
        btn.innerText = "Vào Trang Quản Trị 👑";
      });
    }

    // 4. Đăng nhập Staff an toàn: lưu thông tin và quyền hạn làm việc
    function dangNhapStaff() {
      var staffId = document.getElementById("selectStaffCloud").value;
      var pass = document.getElementById("passStaff").value.trim();

      if (staffId === "none" || !danhSachStaffData[staffId]) {
        alert("Chưa có thông tin nhân sự!");
        return;
      }

      var st = danhSachStaffData[staffId];
      if (st.pass === pass) {
        // Cấp session và dữ liệu nhân sự để trang staff.html nhận diện
        sessionStorage.setItem("sky_staff_logged", "true");
        localStorage.setItem("myIcon", st.icon || "🌸");
        localStorage.setItem("myStaffName", st.ten);
        localStorage.setItem("myStaffSkills", JSON.stringify(st.kyNang || ["uber", "host", "logacc"]));
        
        window.location.href = "staff.html";
      } else {
        alert("Sai mật khẩu riêng của bồ rồi nha!");
      }
    }

    // Khởi chạy hiển thị ban đầu
    hienThiTheoVaiTro();
  </script>

</body>
</html>
