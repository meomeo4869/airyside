<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng Đăng Nhập - Dịch Vụ Sky</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

  <div class="card">
    <h2>Cổng Đăng Nhập</h2>
    
    <label>Bạn là ai dạ?</label><br>
    <select id="roleSelect" onchange="hienThiTheoVaiTro()">
      <option value="khach">Khách Hàng</option>
      <option value="staff">Nhân Sự (Staff)</option>
      <option value="admin">Chủ Page (Admin)</option>
    </select>
    <br><br>

    <!-- 1. KHÁCH HÀNG -->
    <div id="khuVucKhach">
      <button onclick="window.location.href='lobby.html'">Vào Sảnh Tham Quan ✨</button>
    </div>

    <!-- 2. ADMIN NHẬP PASS -->
    <div id="khuVucAdmin" style="display: none;">
      <label>Mật mã Chủ Page:</label><br>
      <input type="password" id="passAdmin" placeholder="Nhập pass admin..." onkeypress="if(event.key==='Enter') dangNhapAdmin()">
      <br><br>
      <button onclick="dangNhapAdmin()">Vào Trang Quản Trị 👑</button>
    </div>

    <!-- 3. STAFF ĐĂNG NHẬP THEO TÀI KHOẢN CLOUD -->
    <div id="khuVucStaff" style="display: none;">
      <label>Chọn tên nhân sự của bạn:</label><br>
      <select id="selectStaffCloud">
        <option value="none">-- Đang tải danh sách Staff --</option>
      </select>
      <br><br>
      <label>Mật khẩu riêng của bạn:</label><br>
      <input type="password" id="passStaff" placeholder="Nhập pass riêng..." onkeypress="if(event.key==='Enter') dangNhapStaff()">
      <br><br>
      <button onclick="dangNhapStaff()">Vào Ca Làm Việc 🚀</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCEuMuKn4ZrzQNQCYnxt9XeNpPUsfQk54c",
      authDomain: "ordersky.firebaseapp.com",
      databaseURL: "https://ordersky-default-rtdb.firebaseio.com",
      projectId: "ordersky",
      storageBucket: "ordersky.firebasestorage.app",
      messagingSenderId: "332284986658",
      appId: "1:332284986658:web:02c42c4181900fc2e0917b",
      measurementId: "G-35XQCYMK8V"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    var danhSachStaffData = {};

    // Tải danh sách Staff từ Firebase
    db.ref('danhSachStaff').on('value', function(snapshot) {
      danhSachStaffData = snapshot.val() || {};
      var select = document.getElementById("selectStaffCloud");
      select.innerHTML = "";

      var keys = Object.keys(danhSachStaffData);
      if (keys.length === 0) {
        select.innerHTML = `<option value="none">Chưa có Staff nào (Liên hệ Admin)</option>`;
      } else {
        keys.forEach(function(k) {
          var st = danhSachStaffData[k];
          select.innerHTML += `<option value="${k}">${st.icon || "🌸"} ${st.ten}</option>`;
        });
      }
    });

    function hienThiTheoVaiTro() {
      var vaiTro = document.getElementById("roleSelect").value;
      document.getElementById("khuVucKhach").style.display = vaiTro === "khach" ? "block" : "none";
      document.getElementById("khuVucAdmin").style.display = vaiTro === "admin" ? "block" : "none";
      document.getElementById("khuVucStaff").style.display = vaiTro === "staff" ? "block" : "none";
    }

    function dangNhapAdmin() {
      var pass = document.getElementById("passAdmin").value.trim();
      if (pass === "boss123") {
        window.location.href = "admin.html";
      } else {
        alert("Sai mật khẩu Admin rồi bồ ơi! (Mặc định: boss123)");
      }
    }

    function dangNhapStaff() {
      var staffId = document.getElementById("selectStaffCloud").value;
      var pass = document.getElementById("passStaff").value.trim();

      if (staffId === "none" || !danhSachStaffData[staffId]) {
        alert("Chưa có thông tin nhân sự!");
        return;
      }

      var st = danhSachStaffData[staffId];
      if (st.pass === pass) {
        // Lưu thông tin nhân sự và mảng kỹ năng vào máy
        localStorage.setItem("myIcon", st.icon || "🌸");
        localStorage.setItem("myStaffName", st.ten);
        localStorage.setItem("myStaffSkills", JSON.stringify(st.kyNang || ["uber", "host", "logacc"]));
        
        window.location.href = "staff.html";
      } else {
        alert("Sai mật khẩu riêng của bồ rồi nha!");
      }
    }

    hienThiTheoVaiTro();
  </script>

</body>
</html>
