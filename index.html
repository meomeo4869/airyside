<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng Đăng Nhập - Dịch Vụ Sky</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

  <!-- THẺ CARD LIQUID GLASS CĂN GIỮA TUYỆT ĐỐI -->
  <div class="card">
    <div style="font-size: 34px; margin-bottom: 6px;">☁️</div>
    <h2>Cổng Kết Nối Sky</h2>
    
    <label for="vaiTro">Bạn muốn đăng nhập vai trò nào?</label>
    <select id="vaiTro" onchange="chuyenVaiTro()">
      <option value="khach">Khách Hàng</option>
      <option value="staff">Nhân Sự (Staff)</option>
      <option value="admin">Quản Trị Viên (Admin)</option>
    </select>

    <!-- KHUNG ĐĂNG NHẬP DÀNH CHO STAFF -->
    <div id="formStaff" style="display: none; margin-top: 10px;">
      <label for="staffSelect">Chọn nhân sự của bạn:</label>
      <select id="staffSelect">
        <option value="">-- Đang tải danh sách Staff... --</option>
      </select>

      <label for="staffPass">Mật khẩu riêng của bạn:</label>
      <input type="password" id="staffPass" placeholder="Nhập mật khẩu Staff...">
    </div>

    <!-- KHUNG ĐĂNG NHẬP DÀNH CHO ADMIN -->
    <div id="formAdmin" style="display: none; margin-top: 10px;">
      <label for="adminPass">Mật khẩu Admin:</label>
      <input type="password" id="adminPass" placeholder="Nhập mật khẩu quản trị viên...">
    </div>

    <button type="button" id="btnDangNhap" onclick="xuLyDangNhap()" style="width: 100%; margin-top: 8px;">
      Vào Sảnh Tham Quan ✨
    </button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCEuMuKn4ZrzQNQCYnxt9XeNpPUsfQk54c",
      authDomain: "ordersky.firebaseapp.com",
      databaseURL: "https://ordersky-default-rtdb.firebaseio.com",
      projectId: "ordersky",
      storageBucket: "ordersky.firebasestorage.app",
      messagingSenderId: "332284986658",
      appId: "1:332284986658:web:02c42c4181900fc2e0917b",
      measurementId: "G-35XQCYMK8V"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    var danhSachStaffData = {};

    db.ref('danhSachStaff').on('value', function(snapshot) {
      danhSachStaffData = snapshot.val() || {};
      var select = document.getElementById("staffSelect");
      select.innerHTML = '<option value="">-- Chọn tên của bạn --</option>';
      Object.keys(danhSachStaffData).forEach(function(key) {
        var st = danhSachStaffData[key];
        select.innerHTML += `<option value="${key}">${st.icon || "🌸"} ${st.ten}</option>`;
      });
    });

    function chuyenVaiTro() {
      var vt = document.getElementById("vaiTro").value;
      var fStaff = document.getElementById("formStaff");
      var fAdmin = document.getElementById("formAdmin");
      var btn = document.getElementById("btnDangNhap");

      if (vt === "khach") {
        fStaff.style.display = "none";
        fAdmin.style.display = "none";
        btn.innerText = "Vào Sảnh Tham Quan ✨";
      } else if (vt === "staff") {
        fStaff.style.display = "block";
        fAdmin.style.display = "none";
        btn.innerText = "Vào Ca Làm Việc 🚀";
      } else if (vt === "admin") {
        fStaff.style.display = "none";
        fAdmin.style.display = "block";
        btn.innerText = "Đăng Nhập Quản Trị 🛡️";
      }
    }

    function xuLyDangNhap() {
      var vt = document.getElementById("vaiTro").value;

      if (vt === "khach") {
        window.location.href = "lobby.html";
      } else if (vt === "staff") {
        var staffKey = document.getElementById("staffSelect").value;
        var pass = document.getElementById("staffPass").value.trim();

        if (!staffKey) { alert("Vui lòng chọn nhân sự!"); return; }
        var st = danhSachStaffData[staffKey];
        if (st && st.pass === pass) {
          sessionStorage.setItem("sky_staff_logged", "true");
          localStorage.setItem("myStaffName", st.ten);
          localStorage.setItem("myIcon", st.icon || "🌸");
          localStorage.setItem("myStaffSkills", JSON.stringify(st.kyNang || ["uber", "host", "logacc"]));
          window.location.href = "staff.html";
        } else {
          alert("Sai mật khẩu Staff!");
        }
      } else if (vt === "admin") {
        var passAd = document.getElementById("adminPass").value.trim();
        if (passAd === "0000") {
          sessionStorage.setItem("sky_admin_logged", "true");
          window.location.href = "admin.html";
        } else {
          alert("Mật khẩu Admin không chính xác!");
        }
      }
    }
  </script>
</body>
</html>
