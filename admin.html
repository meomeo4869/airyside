<!-- Khung Thêm Nhanh Dịch Vụ Mới (Có Cả Giá Tiền Mặt & Tim Sky) -->
      <div style="background: rgba(248, 250, 252, 0.85); padding: 16px; border-radius: 14px; margin-bottom: 16px;">
        <h4 style="margin:0 0 10px 0; font-size:13px;">➕ Thêm Gói Dịch Vụ Mới</h4>
        <div style="display: grid; grid-template-columns: 1fr 1.2fr 1.2fr 1fr 1fr auto; gap: 8px; align-items: flex-end;">
          <div>
            <label>Mảng:</label>
            <select id="admTreeMang" style="margin-bottom:0;">
              <option value="uber">⚡ UBER</option>
              <option value="host">🌸 HOST</option>
              <option value="logacc">🔒 LOG ACC</option>
            </select>
          </div>
          <div>
            <label>Nhóm (Cấp 1):</label>
            <input type="text" id="admTreeNhom" placeholder="vd: Nhặt nến, Đi eden..." style="margin-bottom:0;">
          </div>
          <div>
            <label>Gói (Cấp 2):</label>
            <input type="text" id="admTreeGoi" placeholder="vd: 15 nến, 1h..." style="margin-bottom:0;">
          </div>
          <div>
            <label>Giá Tiền Mặt:</label>
            <input type="text" id="admTreeGia" placeholder="vd: 15k..." style="margin-bottom:0;">
          </div>
          <div>
            <label>Giá Tim Sky:</label>
            <input type="text" id="admTreeGiaTim" placeholder="vd: 6 Tim..." style="margin-bottom:0;">
          </div>
          <button type="button" onclick="themNhanhCayMoi()" style="background:#0284c7; color:white; height:38px;">Thêm ✨</button>
        </div>
      </div>
