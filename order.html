<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt Dịch Vụ Sky</title>
  <link rel="stylesheet" href="style.css">
  <!-- Thư viện Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

  <div class="card">
    <h2>Form Đặt Dịch Vụ Sky</h2>

    <!-- KHU VỰC 1: Form điền thông tin -->
    <div id="formKhach">
      <label>Tên của bạn:</label> <br>
      <input type="text" id="playerName" placeholder="Nhập tên vào đây nha...">
      <br><br>

      <label>Bạn muốn đặt dịch vụ nào?</label> <br>
      <select id="mangDichVu" onchange="doiTuyChon()">
        <option value="chua_chon">-- Chọn mảng dịch vụ --</option>
        <option value="uber">Uber</option>
        <option value="host">Host</option>
        <option value="logacc">Log acc</option>
      </select>
      <br><br>

      <label>Cụ thể</label> <br>
      <select id="cuThe">
        <option value="none">-- Vui lòng chọn mảng ở trên trước --</option>
      </select>
      <br><br>

      <label>Giờ bắt đầu dịch vụ (Bắt buộc):</label> <br>
      <input type="time" id="gioBatDau">
      <br><br>

      <label>Yêu cầu của bạn:</label> <br>
      <input type="text" id="yeuCau" placeholder="Yêu cầu...">
      <br><br>

      <button onclick="checkOrder()">Xác Nhận Đặt Đơn</button>
    </div>

    <!-- KHU VỰC 2: Màn hình chờ -->
    <div id="manHinhCho" style="display: none; text-align: center; padding: 30px 0;">
      <div class="spinner"></div>
      <br>
      <p style="color: #ffb088; font-weight: bold;">Đang chuyển đơn lên hệ thống, bồ chờ xíu nha...</p>
    </div>
  </div>

  <script>
    // Cấu hình Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyCEuMuKn4ZrzQNQCYnxt9XeNpPUsfQk54c",
      authDomain: "ordersky.firebaseapp.com",
      databaseURL: "https://ordersky-default-rtdb.firebaseio.com",
      projectId: "ordersky",
      storageBucket: "ordersky.firebasestorage.app",
      messagingSenderId: "332284986658",
      appId: "1:332284986658:web:02c42c4181900fc2e0917b",
      measurementId: "G-35XQCYMK8V"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function checkOrder() {
      var tenKhach = document.getElementById("playerName").value;
      var mang = document.getElementById("mangDichVu").value;
      var cuThe = document.getElementById("cuThe").value;
      var gio = document.getElementById("gioBatDau").value;
      var yc = document.getElementById("yeuCau").value;

      if (tenKhach == "") {
        alert("Bạn ơi, chưa nhập tên kìa!");
      } else if (mang == "chua_chon") {
        alert("Bạn ơi, nhớ chọn mảng dịch vụ nha!");
      } else if (cuThe == "none") {
        alert("Bạn ơi, chọn dịch vụ cụ thể ở ô bên dưới nha!");
      } else if (gio == "") {
        alert("Bạn ơi, nhớ chọn giờ bắt đầu dịch vụ nha!");
      } else {
        var donHangMoi = {
          tenKhach: tenKhach,
          mangDichVu: mang,
          cuThe: cuThe,
          gio: gio,
          yeuCau: yc,
          daNhan: false,
          thoiGianTao: Date.now()
        };

        // Gửi đơn lên Firebase Cloud
        db.ref('donHangSky').push(donHangMoi).then(function() {
          document.getElementById("formKhach").style.display = "none";
          document.getElementById("manHinhCho").style.display = "block";
          setTimeout(function() {
            alert("Hệ thống đã nhận được đơn của bạn thành công!");
          }, 1000);
        }).catch(function(error) {
          alert("Lỗi kết nối: " + error.message);
        });
      }
    }

    function doiTuyChon() {
      var mang = document.getElementById("mangDichVu").value;
      var oCuThe = document.getElementById("cuThe");
      oCuThe.innerHTML = "";

      if (mang == "uber" || mang == "logacc") {
        oCuThe.innerHTML += '<option value="none">-- Chọn dịch vụ cụ thể --</option>';
        oCuThe.innerHTML += '<option value="15nen">Nhặt 15 nến</option>';
        oCuThe.innerHTML += '<option value="15nen_quest">Nhặt 15 nến + Quest</option>';
        oCuThe.innerHTML += '<option value="xamnen">Xám nến</option>';
        oCuThe.innerHTML += '<option value="xamnen_quest">Xám nến + Quest</option>';
        oCuThe.innerHTML += '<option value="nhatcanh">Nhặt cánh</option>';
        oCuThe.innerHTML += '<option value="eden">Đi Eden</option>';
      } else if (mang == "host") {
        oCuThe.innerHTML += '<option value="none">-- Chọn dịch vụ cụ thể --</option>';
        oCuThe.innerHTML += '<option value="tamsu">Tâm sự</option>';
        oCuThe.innerHTML += '<option value="dan">Đàn</option>';
        oCuThe.innerHTML += '<option value="nguoiyeu">Fakelove</option>';
        oCuThe.innerHTML += '<option value="treomay">Treo máy</option>';
      } else {
        oCuThe.innerHTML += '<option value="none">-- Vui lòng chọn mảng ở trên trước --</option>';
      }
    }
  </script>
</body>
</html>
