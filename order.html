<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt Dịch Vụ Sky</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

  <div class="card">
    <h2>Form Đặt Dịch Vụ Sky</h2>

    <div id="formKhach">
      <label>Tên của bạn (Tên ingame):</label> <br>
      <input type="text" id="playerName" placeholder="Nhập tên vào đây nha...">
      <br><br>

      <label>Bạn muốn đặt dịch vụ nào?</label> <br>
      <select id="mangDichVu">
        <option value="chua_chon">-- Chọn mảng dịch vụ --</option>
        <option value="uber">Uber Dẫn Tour</option>
        <option value="host">Host Đồng Hành</option>
        <option value="logacc">Log Acc Trọn Gói</option>
      </select>
      <br><br>

      <label>Cụ thể:</label> <br>
      <select id="cuThe">
        <option value="none">-- Vui lòng chọn mảng ở trên trước --</option>
      </select>
      <br><br>

      <label>Lịch hẹn (Ngày & Giờ bắt đầu):</label> <br>
      <input type="datetime-local" id="thoiGianBatDau">
      <br><br>

      <label>Hình thức thanh toán:</label> <br>
      <select id="phuongThucTT">
        <option value="Tien_VND">💵 Tiền mặt (Chuyển khoản / Momo)</option>
        <option value="Tim_Sky">💖 Tim Sky (Vật phẩm game)</option>
      </select>
      <br><br>

      <label>Yêu cầu hoặc ghi chú thêm:</label> <br>
      <input type="text" id="yeuCau" placeholder="Ghi chú chi tiết...">
      <br><br>

      <button onclick="kiemTraVaHienHoaDon()">Xem Hóa Đơn & Đặt Đơn</button>
    </div>
  </div>

  <!-- POPUP HÓA ĐƠN ĐÚNG 5 DÒNG CHUẨN -->
  <div id="modalHoaDonOrder" class="modal-overlay">
    <div class="modal-content" style="max-width: 380px; padding: 22px; border-radius: 12px; background: white;">
      
      <div style="border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 15px; text-align: center;">
        <h3 style="margin: 0; color: #0284c7; text-transform: uppercase;">📑 HÓA ĐƠN ĐẶT ĐƠN</h3>
      </div>

      <!-- 4 Dòng thông tin giá -->
      <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; font-size: 13px;">
        <div style="display: flex; justify-content: space-between;">
          <span style="color: #64748b;">1. Tên dịch vụ:</span>
          <strong id="invTenDichVu" style="color: #1e293b; text-align: right;">-</strong>
        </div>
        <div style="display: flex; justify-content: space-between;">
          <span style="color: #64748b;">2. Phí dịch vụ:</span>
          <strong id="invPhiDichVu" style="color: #1e293b; text-align: right;">-</strong>
        </div>
        <div style="display: flex; justify-content: space-between;">
          <span style="color: #64748b;">3. Giảm giá (Event):</span>
          <strong id="invGiamGia" style="color: #ea580c; text-align: right;">0đ</strong>
        </div>
        <div style="display: flex; justify-content: space-between; border-top: 1px dashed #cbd5e1; padding-top: 8px; font-size: 15px;">
          <span style="font-weight: bold; color: #1e293b;">4. Tổng tiền:</span>
          <strong id="invTongTien" style="color: #16a34a; font-size: 16px; text-align: right;">-</strong>
        </div>
      </div>

      <!-- 5. Một số luật do Admin cài đặt -->
      <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; font-size: 12px; color: #475569; line-height: 1.5; margin-bottom: 16px;">
        <strong style="color: #1e293b;">5. Một số luật & lưu ý:</strong>
        <div id="invNoiDungLuat" style="white-space: pre-line; margin-top: 4px;">
          • Khách hàng và Staff trao đổi lịch sự, tôn trọng lẫn nhau.
          • Nếu có điều gì không hài lòng vui lòng bấm Report để Admin can thiệp.
        </div>
      </div>

      <div style="display: flex; gap: 8px;">
        <button onclick="xacNhanLuuDon()" style="flex: 2; background: #0284c7; font-weight: bold; padding: 10px;">Xác Nhận & Vào Sảnh ✨</button>
        <button onclick="dongModalHoaDon()" style="flex: 1; background: #e2e8f0; color: #333; padding: 10px;">Sửa Lại</button>
      </div>

    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCEuMuKn4ZrzQNQCYnxt9XeNpPUsfQk54c",
      authDomain: "ordersky.firebaseapp.com",
      databaseURL: "https://ordersky-default-rtdb.firebaseio.com",
      projectId: "ordersky",
      storageBucket: "ordersky.firebasestorage.app",
      messagingSenderId: "332284986658",
      appId: "1:332284986658:web:02c42c4181900fc2e0917b",
      measurementId: "G-35XQCYMK8V"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    var bangGiaData = {};
    var luatHoaDonText = "";

    db.ref('bangGiaChiTiet').on('value', function(snap) { bangGiaData = snap.val() || {}; });
    db.ref('caiDatPage/luatHoaDon').on('value', function(snap) {
      luatHoaDonText = snap.val() || "• Khách hàng trao đổi thân thiện, lịch sự.\n• Nếu có bất kỳ sự cố gì vui lòng bấm nút Báo Cáo để Admin bồi thường.";
    });

    document.getElementById("mangDichVu").addEventListener("change", function() {
      var mang = this.value;
      var oCuThe = document.getElementById("cuThe");
      oCuThe.innerHTML = "";

      if (mang === "uber") {
        oCuThe.innerHTML = `
          <option value="none">-- Chọn dịch vụ Uber --</option>
          <option value="15nen">Nhặt 15 nến</option>
          <option value="15nen_quest">Nhặt 15 nến + Quest</option>
          <option value="xamnen">Xám nến (Full vạch)</option>
          <option value="xamnen_quest">Xám nến + Quest</option>
          <option value="nhatcanh">Full nhặt cánh (Wing)</option>
          <option value="eden">Dẫn đi Eden full ca</option>
        `;
      } else if (mang === "host") {
        oCuThe.innerHTML = `
          <option value="none">-- Chọn dịch vụ Host --</option>
          <option value="tamsu">Tâm sự / Trò chuyện (1h)</option>
          <option value="dan">Đàn hát theo yêu cầu (1h)</option>
          <option value="nguoiyeu">Fakelove / Ghép đôi (1h)</option>
          <option value="treomay">Treo máy ngủ cùng (Đêm)</option>
        `;
      } else if (mang === "logacc") {
        oCuThe.innerHTML = `
          <option value="none">-- Chọn dịch vụ Log Acc --</option>
          <option value="15nen">Chạy 15 nến / Ngày</option>
          <option value="xamnen">Chạy xám nến + Quest / Ngày</option>
          <option value="tuan">Gói tuần (7 ngày)</option>
          <option value="thang">Gói tháng (30 ngày)</option>
        `;
      } else {
        oCuThe.innerHTML = '<option value="none">-- Vui lòng chọn mảng ở trên trước --</option>';
      }
    });

    var donHangTamThoi = null;

    function kiemTraVaHienHoaDon() {
      var tenKhach = document.getElementById("playerName").value.trim();
      var mang = document.getElementById("mangDichVu").value;
      var cuThe = document.getElementById("cuThe").value;
      var thoiGian = document.getElementById("thoiGianBatDau").value;
      var pttt = document.getElementById("phuongThucTT").value;
      var yc = document.getElementById("yeuCau").value.trim();

      if (tenKhach === "") { alert("Bạn ơi, chưa nhập tên kìa!"); return; }

      db.ref('blackListKhach/' + tenKhach.toLowerCase()).once('value').then(function(snap) {
        if (snap.exists()) {
          alert("⛔ Tên của bạn đang nằm trong danh sách cấm của Page. Vui lòng liên hệ Admin!");
          return;
        }

        if (mang === "chua_chon" || cuThe === "none" || thoiGian === "") {
          alert("Bồ vui lòng điền đầy đủ mảng dịch vụ và giờ hẹn nha!");
          return;
        }

        var dt = new Date(thoiGian);
        var tgDinhDang = `${dt.getHours().toString().padStart(2, '0')}:${dt.getMinutes().toString().padStart(2, '0')} ngày ${dt.getDate()}/${dt.getMonth()+1}/${dt.getFullYear()}`;

        var keyGia = mang + "_" + cuThe;
        var giaNiemYet = bangGiaData[keyGia] || "Theo thỏa thuận";

        // TÍNH TOÁN: TỔNG TIỀN = PHÍ DỊCH VỤ - GIẢM GIÁ
        var phiDichVuHienThi = giaNiemYet;
        var giamGiaHienThi = "0đ";
        var tongTienHienThi = giaNiemYet;

        if (pttt === "Tien_VND") {
          // Bóc tách chữ số từ chuỗi giá (ví dụ: '15k' -> 15000, '25.000đ' -> 25000)
          var chuoiSo = giaNiemYet.toLowerCase().replace(/[^0-9k]/g, '');
          var phiSo = 0;

          if (chuoiSo.includes('k')) {
            phiSo = parseFloat(chuoiSo.replace('k', '')) * 1000;
          } else {
            phiSo = parseFloat(chuoiSo) || 0;
          }

          var giamGiaSo = 0; // Số tiền giảm giá (VND) - có thể gắn mã coupon sau này

          if (phiSo > 0) {
            var tongSo = Math.max(0, phiSo - giamGiaSo);
            phiDichVuHienThi = phiSo.toLocaleString('vi-VN') + "đ";
            giamGiaHienThi = giamGiaSo.toLocaleString('vi-VN') + "đ";
            tongTienHienThi = tongSo.toLocaleString('vi-VN') + "đ";
          }
        } else {
          // Đơn Tim Sky
          phiDichVuHienThi = giaNiemYet;
          giamGiaHienThi = "0 Tim";
          tongTienHienThi = giaNiemYet;
        }

        donHangTamThoi = {
          tenKhach: tenKhach,
          mangDichVu: mang,
          cuThe: cuThe,
          thoiGianHen: tgDinhDang,
          rawTime: thoiGian,
          thanhToan: pttt,
          phiGoc: phiDichVuHienThi,
          giamGia: giamGiaHienThi,
          giaNiemYet: tongTienHienThi,
          daThanhToanFull: (pttt === "Tim_Sky"),
          yeuCau: yc || "Không có yêu cầu đặc biệt",
          daNhan: false,
          trangThai: "dang_cho",
          thoiGianTao: Date.now()
        };

        // Điền vào Popup hóa đơn
        document.getElementById("invTenDichVu").innerText = `${mang.toUpperCase()} (${cuThe})`;
        document.getElementById("invPhiDichVu").innerText = phiDichVuHienThi;
        document.getElementById("invGiamGia").innerText = giamGiaHienThi;
        document.getElementById("invTongTien").innerText = tongTienHienThi;
        document.getElementById("invNoiDungLuat").innerText = luatHoaDonText;

        document.getElementById("modalHoaDonOrder").style.display = "flex";
      });
    }

    function dongModalHoaDon() { document.getElementById("modalHoaDonOrder").style.display = "none"; }

    function xacNhanLuuDon() {
      if (!donHangTamThoi) return;
      var newOrderRef = db.ref('donHangSky').push();
      newOrderRef.set(donHangTamThoi).then(function() {
        var myOrders = JSON.parse(localStorage.getItem("myOrderIdsList") || "[]");
        myOrders.push(newOrderRef.key);
        localStorage.setItem("myOrderIdsList", JSON.stringify(myOrders));
        window.location.href = "lobby.html";
      }).catch(function(error) {
        alert("Lỗi kết nối: " + error.message);
      });
    }
  </script>
</body>
</html>
